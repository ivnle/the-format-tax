[project]
name = "the-format-tax"
version = "0.1.0"
description = "Minimal reproduction of the format tax: accuracy drops when LLMs produce structured output"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Ivan Yee Lee"},
    {name = "Loris D'Antoni"},
    {name = "Taylor Berg-Kirkpatrick"},
]
dependencies = [
    "vllm==0.19.0",
    "datasets",
    "tabulate",
    "jinja2",
    "lark",
    "openai>=1.50",
]

[dependency-groups]
dev = [
    "pydantic>=2,<3",
]

[tool.uv]
package = false

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
